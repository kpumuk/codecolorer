name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: GitHub Actions Security
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          advanced-security: false
          annotations: true
          persona: pedantic

  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "7.0"
            phpunit: "6"
          - php: "7.1"
            phpunit: "7"
          - php: "7.2"
            phpunit: "8"
          - php: "7.3"
            phpunit: "9"
          - php: "7.4"
            phpunit: "9"
          - php: "8.0"
            phpunit: "9"
          - php: "8.1"
            phpunit: "10"
          - php: "8.2"
            phpunit: "10"
          - php: "8.3"
            phpunit: "10"
          - php: "8.4"
            phpunit: "10"
          - php: "8.5"
            phpunit: "10"

    name: PHP ${{ matrix.php }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: dom, mbstring, xml, xmlwriter
          tools: phpunit:${{ matrix.phpunit }}

      - name: Show runtime versions
        run: |
          php --version
          phpunit --version

      - name: Run PHPUnit
        run: phpunit --configuration tests/phpunit-ci.xml

  wordpress:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress:
          - "6.7"
          - "6.8"
          - "6.9"
          - "7.0"

    name: WordPress ${{ matrix.wordpress }}

    services:
      mysql:
        image: mariadb:10.11@sha256:407fccb51e710f34752c1a3ef9b936d1f55f38d4ac7fa043b3759742d266fd9a
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mariadb-admin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=6

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: "8.2"
          coverage: none
          extensions: dom, mbstring, mysqli, xml, xmlwriter

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client

      - name: Install WordPress test suite
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          WORDPRESS_VERSION: ${{ matrix.wordpress }}
          WP_INSTALL_TESTS_SKIP_UPDATE_CHECK: "true"
        run: |
          bin/install-wp-tests.sh codecolorer_test root root "127.0.0.1:${MYSQL_PORT}" "${WORDPRESS_VERSION}"

      - name: Run WordPress integration tests
        run: vendor/bin/phpunit --configuration tests/phpunit-wp.xml
