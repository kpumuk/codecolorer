name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Development Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.18.0"
          cache: pnpm

      - name: Install development dependencies
        run: pnpm install --frozen-lockfile

      - name: Check dependency security and compatibility
        run: pnpm run test:dependencies && pnpm audit

  zizmor:
    name: GitHub Actions Security
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          annotations: true
          persona: pedantic

  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "7.0"
            phpunit: "6"
          - php: "7.1"
            phpunit: "7"
          - php: "7.2"
            phpunit: "8"
          - php: "7.3"
            phpunit: "9"
          - php: "7.4"
            phpunit: "9"
          - php: "8.0"
            phpunit: "9"
          - php: "8.1"
            phpunit: "10"
          - php: "8.2"
            phpunit: "10"
          - php: "8.3"
            phpunit: "10"
          - php: "8.4"
            phpunit: "10"
          - php: "8.5"
            phpunit: "10"

    name: PHP ${{ matrix.php }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: dom, mbstring, xml, xmlwriter
          tools: phpunit:${{ matrix.phpunit }}

      - name: Show runtime versions
        run: |
          php --version
          phpunit --version

      - name: Run PHPUnit
        run: phpunit --configuration tests/phpunit-ci.xml

  wordpress:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress:
          - "6.7"
          - "6.8"
          - "6.9"
          - "7.0"
          - "7.1-RC2"

    name: WordPress ${{ matrix.wordpress }}

    services:
      mysql:
        image: mariadb:10.11@sha256:407fccb51e710f34752c1a3ef9b936d1f55f38d4ac7fa043b3759742d266fd9a
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mariadb-admin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=6

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.2"
          coverage: none
          extensions: dom, mbstring, mysqli, xml, xmlwriter

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client

      - name: Install WordPress test suite
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          WORDPRESS_VERSION: ${{ matrix.wordpress }}
          WP_INSTALL_TESTS_SKIP_UPDATE_CHECK: "true"
        run: |
          bin/install-wp-tests.sh codecolorer_test root root "127.0.0.1:${MYSQL_PORT}" "${WORDPRESS_VERSION}"

      - name: Run WordPress integration tests
        run: vendor/bin/phpunit --configuration tests/phpunit-wp.xml
